<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2480 3508" font-family="DejaVu Sans">
  <!-- Affiche A4 300 DPI (210x297mm) — Edukisto brand poster -->
  <rect width="2480" height="3508" fill="#333333"/>

  <!-- Étoile décorative en fond (filigrane, coin haut droit) -->
  <g transform="translate(2050,180) scale(2.2)" opacity="0.08">
    <path d="M32 3l5.2 18.2 10.8-5.2-5.2 10.8L61 32l-18.2 5.2 5.2 10.8-10.8-5.2L32 61l-5.2-18.2-10.8 5.2 5.2-10.8L3 32l18.2-5.2-5.2-10.8 10.8 5.2z" fill="#38bdf8"/>
  </g>
  <g transform="translate(60,3050) scale(1.4)" opacity="0.06">
    <path d="M32 3l5.2 18.2 10.8-5.2-5.2 10.8L61 32l-18.2 5.2 5.2 10.8-10.8-5.2L32 61l-5.2-18.2-10.8 5.2 5.2-10.8L3 32l18.2-5.2-5.2-10.8 10.8 5.2z" fill="#38bdf8"/>
  </g>

  <!-- Logo -->
  <g transform="translate(928, 420) scale(15.625)">
    <path d="M32 3l5.2 18.2 10.8-5.2-5.2 10.8L61 32l-18.2 5.2 5.2 10.8-10.8-5.2L32 61l-5.2-18.2-10.8 5.2 5.2-10.8L3 32l18.2-5.2-5.2-10.8 10.8 5.2z" fill="#38bdf8"/>
    <path d="M32 32c-1.6-2-3-3.1-4.8-3.1a4.7 4.7 0 1 0 0 9.4c1.8 0 3.2-1.1 4.8-3.1 1.6 2 3 3.1 4.8 3.1a4.7 4.7 0 1 0 0-9.4c-1.8 0-3.2 1.1-4.8 3.1z" stroke="#0f1115" stroke-width="2.2"/>
  </g>

  <!-- Nom de marque -->
  <text x="1240" y="1760" text-anchor="middle" font-size="380" font-weight="bold" fill="#ffffff" letter-spacing="6">Edukisto</text>

  <!-- Phrase d'accroche -->
  <text x="1240" y="2040" text-anchor="middle" font-size="150" fill="#38bdf8">Votre informaticien de proximité</text>

  <!-- Séparateur -->
  <rect x="640" y="2200" width="1200" height="6" rx="3" fill="#38bdf8" opacity="0.6"/>

  <!-- QR code (fond blanc arrondi + image) -->
  <rect x="800" y="2400" width="880" height="880" rx="24" fill="#ffffff"/>

  <!-- Call to action sous le QR -->
  <text x="1240" y="3430" text-anchor="middle" font-size="88" fill="#ffffff">Scannez pour découvrir mes applications et services</text>

  <!-- Pied de page -->
  <text x="1240" y="3310" text-anchor="middle" font-size="70" fill="#7dd3fc" opacity="0.85">edukisto.win · Seneffe &amp; 20 km alentour · 1er contact gratuit</text>
</svg>
