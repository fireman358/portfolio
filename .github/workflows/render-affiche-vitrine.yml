name: Affiches vitrine - rendu PNG 300 DPI

on:
  push:
    branches: [main]
    paths:
      - 'brand/kit/affiche-vitrine-a4.svg'
      - '.github/workflows/render-affiche-vitrine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer librsvg + polices DejaVu
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends librsvg2-bin fonts-dejavu-core

      - name: Rendu A4 (2480x3508) et A3 (3508x4961)
        run: |
          rsvg-convert -w 2480 -h 3508 brand/kit/affiche-vitrine-a4.svg -o /tmp/a4.png
          rsvg-convert -w 3508 -h 4961 brand/kit/affiche-vitrine-a4.svg -o /tmp/a3.png

      - name: Metadonnees 300 DPI (pHYs)
        run: |
          python3 - <<'PY'
          import struct, zlib

          def set_dpi(src, dst, dpi=300):
              d = open(src, 'rb').read()
              assert d[:8] == b'\x89PNG\r\n\x1a\n'
              ppm = int(round(dpi / 0.0254))
              phys = struct.pack('>IIB', ppm, ppm, 1)
              out = bytearray(d[:8])
              pos = 8
              while pos < len(d):
                  ln, typ = struct.unpack('>I4s', d[pos:pos+8])
                  data = d[pos+8:pos+8+ln]
                  pos += 12 + ln
                  if typ == b'pHYs':
                      continue
                  out += struct.pack('>I', ln) + typ + data + struct.pack('>I', zlib.crc32(typ + data) & 0xffffffff)
                  if typ == b'IHDR':
                      out += struct.pack('>I', len(phys)) + b'pHYs' + phys + struct.pack('>I', zlib.crc32(b'pHYs' + phys) & 0xffffffff)
              open(dst, 'wb').write(bytes(out))

          set_dpi('/tmp/a4.png', 'brand/kit/affiche-vitrine-a4.png')
          set_dpi('/tmp/a3.png', 'brand/kit/affiche-vitrine-a3.png')
          PY

      - name: Commit des PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand/kit/affiche-vitrine-a4.png brand/kit/affiche-vitrine-a3.png
          if git diff --cached --quiet; then
            echo "PNG inchanges, rien a commiter"
            exit 0
          fi
          git commit -m "Rendu PNG 300 DPI des affiches vitrine depuis le SVG"
          git push
